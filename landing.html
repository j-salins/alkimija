    .word {
      /* Position words on top of each other */
      font-size: 4rem;
      /* Large font size */
      font-weight: 800;
      color: #FFCB54;
      /* White text */
      opacity: 0;
      /* Initially hidden */
      animation: fadeInOut 8s infinite;
      /* 10s total animation cycle, infinite loop */
      /* Subtle glow */
      text-wrap: nowrap;
      grid-column: 1/2;
      grid-row: 1/2;
      /* Ensure words can take up significant width on smaller screens */
      pointer-events: none;
      user-select: none;
    }

    @keyframes fadeInOut {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }

      /* Start transparent and slightly below */
      /* Reverted percentages based on 8s total duration: */
      14.25% {
        opacity: 1;
        transform: translateY(0);
      }

      /* Fade in (0.5s into 8s = 6.25%) */
      23.5% {
        opacity: 1;
        transform: translateY(0);
      }

      /* Hold (1.0s into 8s = 12.5%) */
      34.75% {
        opacity: 0;
        transform: translateY(-50px);
      }

      /* Fade out (1.5s into 8s = 18.75%) */
      100% {
        opacity: 0;
      }

      /* Remain hidden for the rest of the 8s cycle */
    }

    /* Apply animation delays to each word for sequential appearance */
    .word:nth-child(1) {
      animation-delay: 0s;
    }

    .word:nth-child(2) {
      animation-delay: 2s;
    }

    /* Reverted to 1.5s delay */
    .word:nth-child(3) {
      animation-delay: 4s;
    }

    /* Reverted to 3s delay */
    .word:nth-child(4) {
      animation-delay: 6s;
    }

    /* Reverted to 4.5s delay */
